[colors]
background     = #1E1B24  
background-alt = #2A2430 
foreground     = #EADDE1
primary        = #FF79C6
secondary      = #FFB3D9
alert          = #FF4F81
disabled       = #7D5C6E

[bar/example]
monitor = ${env:MONITOR:}
width = 100%
height = 22pt
radius = 7

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 3pt

border-size = 4pt
border-color = #00000000

padding-left = 0
padding-right = 1

module-margin = 1

separator = |
separator-foreground = ${colors.disabled}

font-0 = JetBrainsMono Nerd Font Mono:size=10;3   
font-1 = JetBrainsMono Nerd Font Mono:size=15;0  

modules-left = i3 playerctl
modules-center = date
modules-right = pulseaudio memory cpu battery

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true

[module/i3]
type = internal/i3
pin-workspaces = true
enable-click = true
enable-scroll = false
strip-wsnumbers = false   

ws-icon-0 = web;󰖟
ws-icon-1 = editor;
ws-icon-2 = term;
ws-icon-3 = exp;
ws-icon-4 = spotify;
ws-icon-5 = discord;
ws-icon-6 = whatsapp;
ws-icon-7 = ticktick;
ws-icon-8 = chatgpt;
ws-icon-9 = git;󰊢
ws-icon-10 = zathura;󰈦 
ws-icon-11 = mail;
ws-icon-12 = meet;
ws-icon-13 = work;
ws-icon-default = 

label-focused   = %{T1}%icon%%{T-}
label-unfocused = %{T1}%icon%%{T-}
label-visible   = %{T1}%icon%%{T-}
label-urgent    = %{T1}%icon%%{T-}
label-empty     = %{T1}%icon%%{T-}

label-focused-foreground = ${colors.foreground}
label-focused-background = ${colors.background-alt}
label-focused-underline  = ${colors.primary}
label-focused-padding    = 1

label-unfocused-padding  = 1

label-visible-foreground = ${colors.foreground}
label-visible-padding    = 1

label-urgent-background  = ${colors.alert}
label-urgent-foreground  = ${colors.background}
label-urgent-padding     = 1

label-empty-foreground   = ${colors.disabled}
label-empty-padding      = 1

[module/playerctl]
type = custom/script
exec = ~/.config/polybar/scripts/playerctl.sh
tail = true

; clicks / scroll
click-left  = playerctl play-pause
click-right = playerctl stop
scroll-up   = playerctl next
scroll-down = playerctl previous

[module/pulseaudio]
type = internal/pulseaudio

format-volume-prefix = "VOL "
format-volume-prefix-foreground = ${colors.primary}
format-volume = <label-volume>

label-volume = %percentage%%

label-muted = muted
label-muted-foreground = ${colors.disabled}

[module/memory]
type = internal/memory
interval = 2
format-prefix = "RAM "
format-prefix-foreground = ${colors.primary}
label = %gb_used:2%

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = "CPU "
format-prefix-foreground = ${colors.primary}
label = %percentage:2%%

[module/date]
type = internal/date
interval = 1

date = 󰥔 %H:%M
date-alt = %Y-%m-%d %H:%M:%S

label = %date%
label-foreground = ${colors.primary}

[settings]
screenchange-reload = true
pseudo-transparency = true

[module/battery]
type = internal/battery

full-at = 99
low-at = 5

; Use the following command to list batteries and adapters:
; $ ls -1 /sys/class/power_supply/
battery = BAT0
adapter = ADP1

; If an inotify event haven't been reported in this many
; seconds, manually poll for new values.
;
; Needed as a fallback for systems that don't report events
; on sysfs/procfs.
;
; Disable polling by setting the interval to 0.
;
; Default: 5
poll-interval = 5

; see "man date" for details on how to format the time string
; NOTE: if you want to use syntax tags here you need to use %%{...}
; Default: %H:%M:%S
time-format = %H:%M

; Available tags:
;   <label-charging> (default)
;   <bar-capacity>
;   <ramp-capacity>
;   <animation-charging>
format-charging = <animation-charging> <label-charging>

; Available tags:
;   <label-discharging> (default)
;   <bar-capacity>
;   <ramp-capacity>
;   <animation-discharging>
format-discharging = <animation-discharging> <label-discharging>

; Available tags:
;   <label-full> (default)
;   <bar-capacity>
;   <ramp-capacity>
;format-full = <ramp-capacity> <label-full>

; Format used when battery level drops to low-at
; If not defined, format-discharging is used instead.
; Available tags:
;   <label-low>
;   <animation-low>
;   <bar-capacity>
;   <ramp-capacity>
; New in version 3.6.0
;format-low = <label-low> <animation-low>

; Available tokens:
;   %percentage% (default) - is set to 100 if full-at is reached
;   %percentage_raw%
;   %time%
;   %consumption% (shows current charge rate in watts)
label-charging = %percentage%%

; Available tokens:
;   %percentage% (default) - is set to 100 if full-at is reached
;   %percentage_raw%
;   %time%
;   %consumption% (shows current discharge rate in watts)
label-discharging = %percentage%%

; Available tokens:
;   %percentage% (default) - is set to 100 if full-at is reached
;   %percentage_raw%
label-full = Fully charged

; Available tokens:
;   %percentage% (default) - is set to 100 if full-at is reached
;   %percentage_raw%
;   %time%
;   %consumption% (shows current discharge rate in watts)
; New in version 3.6.0
label-low = BATTERY LOW

; Only applies if <ramp-capacity> is used
ramp-capacity-0 = 
ramp-capacity-1 = 
ramp-capacity-2 = 
ramp-capacity-3 = 
ramp-capacity-4 = 

; Only applies if <bar-capacity> is used
bar-capacity-width = 10

; Only applies if <animation-charging> is used
animation-charging-0 = 
animation-charging-1 = 
animation-charging-2 = 
animation-charging-3 = 
animation-charging-4 = 
; Framerate in milliseconds
animation-charging-framerate = 750

; Only applies if <animation-discharging> is used
animation-discharging-0 = 
animation-discharging-1 = 
animation-discharging-2 = 
animation-discharging-3 = 
animation-discharging-4 = 
; Framerate in milliseconds
animation-discharging-framerate = 500

; Only applies if <animation-low> is used
; New in version 3.6.0
animation-low-0 = !
animation-low-1 = 
animation-low-framerate = 200
