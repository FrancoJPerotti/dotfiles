[colors]
background     = #1E1B24  
background-alt = #2A2430 
foreground     = #EADDE1
primary        = #FF79C6
secondary      = #FFB3D9
alert          = #FF4F81
disabled       = #7D5C6E

[bar/example]
monitor = ${env:MONITOR:}
width = 100%
height = 22pt
radius = 7

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 3pt

border-size = 4pt
border-color = #00000000

padding-left = 0
padding-right = 1

module-margin = 1

separator = |
separator-foreground = ${colors.disabled}

font-0 = JetBrainsMono Nerd Font Mono:size=10;3   
font-1 = JetBrainsMono Nerd Font Mono:size=15;0  

modules-left = i3 playerctl
modules-center = date
modules-right = pulseaudio memory cpu

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true

[module/i3]
type = internal/i3
pin-workspaces = true
enable-click = true
enable-scroll = false
strip-wsnumbers = false   

ws-icon-0 = web;󰖟
ws-icon-1 = editor;
ws-icon-2 = term;
ws-icon-3 = exp;
ws-icon-4 = spotify;
ws-icon-5 = discord;
ws-icon-6 = whatsapp;
ws-icon-7 = ticktick;
ws-icon-8 = chatgpt;
ws-icon-9 = git;󰊢
ws-icon-10 = zathura;󰈦 
ws-icon-11 = mail;
ws-icon-12 = meet;
ws-icon-13 = work;
ws-icon-default = 

label-focused   = %{T1}%icon%%{T-}
label-unfocused = %{T1}%icon%%{T-}
label-visible   = %{T1}%icon%%{T-}
label-urgent    = %{T1}%icon%%{T-}
label-empty     = %{T1}%icon%%{T-}

label-focused-foreground = ${colors.foreground}
label-focused-background = ${colors.background-alt}
label-focused-underline  = ${colors.primary}
label-focused-padding    = 1

label-unfocused-padding  = 1

label-visible-foreground = ${colors.foreground}
label-visible-padding    = 1

label-urgent-background  = ${colors.alert}
label-urgent-foreground  = ${colors.background}
label-urgent-padding     = 1

label-empty-foreground   = ${colors.disabled}
label-empty-padding      = 1

[module/playerctl]
type = custom/script
exec = ~/.config/polybar/scripts/playerctl.sh
tail = true

; clicks / scroll
click-left  = playerctl play-pause
click-right = playerctl stop
scroll-up   = playerctl next
scroll-down = playerctl previous

[module/pulseaudio]
type = internal/pulseaudio

format-volume-prefix = "VOL "
format-volume-prefix-foreground = ${colors.primary}
format-volume = <label-volume>

label-volume = %percentage%%

label-muted = muted
label-muted-foreground = ${colors.disabled}

[module/memory]
type = internal/memory
interval = 2
format-prefix = "RAM "
format-prefix-foreground = ${colors.primary}
label = %gb_used:2%

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = "CPU "
format-prefix-foreground = ${colors.primary}
label = %percentage:2%%

[module/date]
type = internal/date
interval = 1

date = 󰥔 %H:%M
date-alt = %Y-%m-%d %H:%M:%S

label = %date%
label-foreground = ${colors.primary}

[settings]
screenchange-reload = true
pseudo-transparency = true
