exec = gsettings set org.gnome.desktop.interface icon-theme 'Tela-circle-dracula'
exec = gsettings set org.gnome.desktop.interface gtk-theme 'Catppuccin-Mocha'
exec = gsettings set org.gnome.desktop.interface color-scheme 'prefer-dark'

general {
    gaps_in = 3
    gaps_out = 8
    border_size = 2
    col.active_border = rgba(ca9ee6ff) rgba(f2d5cfff) 45deg
    col.inactive_border = rgba(b4befecc) rgba(6c7086cc) 45deg
    layout = dwindle
    resize_on_border = true
}

group {
    groupbar {
        enabled = true
        col.active = rgba(ca9ee6ff) 
        col.inactive = rgba(666666ff)
        col.locked_active = rgba(ca9ee6ff) rgba(f2d5cfff) 45deg
        col.locked_inactive = rgba(b4befecc) rgba(6c7086cc) 45deg
        font_size = 17
        text_color = rgba(000000ff)
        gradients = true
        gradient_rounding = 10
        render_titles = true
        indicator_height = 0
        height = 20
    }
}

decoration {
    rounding = 10
#    drop_shadow = false

    blur {
        enabled = yes
        size = 6
        passes = 3
        new_optimizations = on
        ignore_opacity = on
        xray = false
    }
}

# layerrule = blur,waybar
