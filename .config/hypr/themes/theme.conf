exec = hyprctl setcursor Bibata-Modern-Ice 20
exec = gsettings set org.gnome.desktop.interface cursor-theme 'Bibata-Modern-Ice'
exec = gsettings set org.gnome.desktop.interface cursor-size 20


#     ____            __ 
#    / __/___  ____  / /_
#   / /_/ __ \/ __ \/ __/
#  / __/ /_/ / / / / /_  
# /_/  \____/_/ /_/\__/  
                       

exec = gsettings set org.gnome.desktop.interface font-name 'Cantarell 10'
exec = gsettings set org.gnome.desktop.interface document-font-name 'Cantarell 10'
exec = gsettings set org.gnome.desktop.interface monospace-font-name 'CaskaydiaCove Nerd Font Mono 9'
exec = gsettings set org.gnome.desktop.interface font-antialiasing 'rgba'
exec = gsettings set org.gnome.desktop.interface font-hinting 'full'


#                          _       __
#    _________  ___  _____(_)___ _/ /
#   / ___/ __ \/ _ \/ ___/ / __ `/ / 
#  (__  ) /_/ /  __/ /__/ / /_/ / /  
# /____/ .___/\___/\___/_/\__,_/_/   
#     /_/                            


decoration {
    dim_special = 0.3
    blur {
        special = true
    }
}


#    __  __                      
#   / /_/ /_  ___  ____ ___  ___ 
#  / __/ __ \/ _ \/ __ `__ \/ _ \
# / /_/ / / /  __/ / / / / /  __/
# \__/_/ /_/\___/_/ /_/ /_/\___/ 
                               

exec = gsettings set org.gnome.desktop.interface icon-theme 'Tela-circle-dracula'
exec = gsettings set org.gnome.desktop.interface gtk-theme 'Catppuccin-Mocha'
exec = gsettings set org.gnome.desktop.interface color-scheme 'prefer-dark'

general {
    gaps_in = 3
    gaps_out = 8
    border_size = 2
    col.active_border = rgba(ca9ee6ff) rgba(f2d5cfff) 45deg
    col.inactive_border = rgba(b4befecc) rgba(6c7086cc) 45deg
    layout = dwindle
    resize_on_border = true
}

group {
    groupbar {
        enabled = true
        col.active = rgba(ca9ee6ff) 
        col.inactive = rgba(666666ff)
        col.locked_active = rgba(ca9ee6ff) rgba(f2d5cfff) 45deg
        col.locked_inactive = rgba(b4befecc) rgba(6c7086cc) 45deg
        font_size = 17
        text_color = rgba(000000ff)
        gradients = true
        gradient_rounding = 10
        render_titles = true
        indicator_height = 0
        height = 20
    }
}

decoration {
    rounding = 10

    blur {
        enabled = yes
        size = 6
        passes = 3
        new_optimizations = on
        ignore_opacity = on
        xray = false
    }
}
