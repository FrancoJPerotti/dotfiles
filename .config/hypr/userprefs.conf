# Set your personal hyprland configuration here
# For a sample file, please refer to https://github.com/prasanthrangan/hyprdots/blob/main/Configs/.config/hypr/userprefs.t2

decoration {
	dim_inactive = true
	dim_strength = 0.23
}

exec-once = sudo ~/.cargo/bin/xremap ~/.config/xremap/keymaps.yml --device Logitech\ \K780
exec-once = wlsunset -t 4500 -l -31.4 -L -64.1 # dim screen at sunset
exec-once = kdeconnect-cli -n Galaxy\ S20 # connect to phone through kdeconnect
exec-once = /opt/vivaldi/vivaldi --profile-directory=Default --app-id=cfammbeebmjdpoppachopcohfchgjapd && hyprctl dispatch workspace 1 # open ticktick app
workspace= name:1, monitor:DP-3 # workspace 1 on middle monitor
exec-once = hyprctl dispatch workspace 1 # focus middle monitor

