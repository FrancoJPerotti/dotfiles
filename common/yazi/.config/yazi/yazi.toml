[mgr]
show_hidden = true
show_symlink = true
ratio = [1, 2, 4]
linemode = "permissions"

[opener]
edit = [
	{ run = 'nvim %s', block = true, for = "unix" },
]

browser = [
	{ run = 'vivaldi %s', orphan = true, for = "unix" },
]

[open]
prepend_rules = [
	{ mime = "text/html", use = "browser" },
	{ url = "*.{html,htm}", use = "browser" },
]

[preview]
max_width = 4000
max_height = 4000
