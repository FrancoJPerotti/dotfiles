# =============================================================================
# Core options
# =============================================================================

set -g default-shell /bin/zsh
set -g mouse on
set -g history-limit 100000

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

set -g detach-on-destroy off
set -g set-clipboard on

set -g allow-rename off
set -g allow-set-title off
setw -g automatic-rename off

set -sg escape-time 10
set -g focus-events on
set -g xterm-keys on
set -g extended-keys always
set -s extended-keys-format csi-u
set -as terminal-features 'xterm*:extkeys'
set -g status-keys vi
setw -g mode-keys vi

# =============================================================================
# Plugins
# =============================================================================
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# Keep our custom status bar, but let Catppuccin draw the window pills.
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_status_style 'rounded'
set -g @catppuccin_window_text ' #W'
set -g @catppuccin_window_current_text ' #W'
set -g @catppuccin_window_middle_separator ' '

run '~/.tmux/plugins/tpm/tpm'

# =============================================================================
# Prefix
# =============================================================================

unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# =============================================================================
# Mode state + colors
# =============================================================================

set -g @mode NORMAL
set -g @accent '#7aa2f7'

set -g @color_normal  '#7aa2f7'
set -g @color_pane    '#9ece6a'
set -g @color_tab     '#e0af68'
set -g @color_resize  '#bb9af7'
set -g @color_session '#73daca'
set -g @color_copy    '#ff9e64'

# =============================================================================
# Status hints
# =============================================================================

set -g @hint_global  'Alt: p pane  ·  t tab  ·  j/k group prev/next  ·  g toggle group  ·  r resize  ·  s copy  ·  Space sessions  ·  d detach'
set -g @hint_pane    'e/i/n/o split  ·  t stack mode  ·  m mark pane  ·  q kill pane  ·  r rename pane  ·  Esc cancel'
set -g @hint_tab     'n new tab  ·  q kill tab  ·  r rename tab  ·  s sync  ·  Esc cancel'
set -g @hint_stack   's new child  ·  j/k prev/next  ·  a absorb marked  ·  e/i/n/o extract  ·  q kill child  ·  r rename  ·  Esc cancel'
set -g @hint_resize  'e/i/n/o resize  ·  Esc back to normal'
set -g @hint_session 's session picker  ·  l last session  ·  r rename session  ·  c edit config  ·  w sessions  ·  Esc cancel'
set -g @hint_copy    'v select  ·  y copy+quit  ·  / ? search  ·  n/N next/prev  ·  q/Esc quit'
set -gF @hint '#{@hint_global}'

# =============================================================================
# Pane titles
# =============================================================================

setw -g pane-border-status top
set -g pane-border-format "#{pane_index} #{?pane_title,#{pane_title},#{pane_current_command}}"

# Keep pane titles sane when tmux/shell leaves them empty or as just the host.
set-hook -g after-new-session  'if -F "#{||:#{==:#{pane_title},},#{==:#{pane_title},#{host}}}" "select-pane -T \"#{?pane_current_command,#{pane_current_command},pane}\"" ; if -F "#{@stack_gid}" "set -g pane-active-border-style fg=#73daca" "set -g pane-active-border-style fg=#7aa2f7"'
set-hook -g after-select-window 'if -F "#{||:#{==:#{pane_title},},#{==:#{pane_title},#{host}}}" "select-pane -T \"#{?pane_current_command,#{pane_current_command},pane}\"" ; if -F "#{@stack_gid}" "set -g pane-active-border-style fg=#73daca" "set -g pane-active-border-style fg=#7aa2f7"'
set-hook -g after-select-pane   'if -F "#{@stack_gid}" "set -g pane-active-border-style fg=#73daca" "set -g pane-active-border-style fg=#7aa2f7"'
set-hook -g after-split-window  'if -F "#{||:#{==:#{pane_title},},#{==:#{pane_title},#{host}}}" "select-pane -T \"#{?pane_current_command,#{pane_current_command},pane}\"" ; if -F "#{@stack_gid}" "set -g pane-active-border-style fg=#73daca" "set -g pane-active-border-style fg=#7aa2f7"'
set-hook -g after-new-window    'if -F "#{||:#{==:#{pane_title},},#{==:#{pane_title},#{host}}}" "select-pane -T \"#{?pane_current_command,#{pane_current_command},pane}\"" ; if -F "#{@stack_gid}" "set -g pane-active-border-style fg=#73daca" "set -g pane-active-border-style fg=#7aa2f7"'

# =============================================================================
# Theme
# =============================================================================

# inactive pane: light gray text, dark gray background
set -g window-style 'fg=colour242'
# active pane: brighter text, default terminal background
set -g window-active-style 'fg=colour250'

set -g status-position top
set -g status-style fg=#c0caf5,bg=#1a1b26
set -g message-style fg=#c0caf5,bg=#283457
set -g message-command-style fg=#c0caf5,bg=#283457

set -g pane-border-style fg=#3b4261
set -g pane-active-border-style 'fg=#7aa2f7'
set -g pane-border-indicators off

set -g display-panes-active-colour '#7aa2f7'
set -g display-panes-colour '#565f89'
set -g clock-mode-colour '#7aa2f7'

set -g status-justify left
set -g status-left-length 200
set -g status-right-length 16

set -g status-left '#[fg=#{@accent},bg=default]#[fg=#1a1b26,bg=#{@accent},bold] #{@mode} #[fg=#{@accent},bg=default,nobold] #[fg=#24283b,bg=default]#[fg=#a9b1d6,bg=#24283b] #{@hint} #[fg=#24283b,bg=default] #[fg=#7aa2f7,bg=default]#[fg=#1a1b26,bg=#7aa2f7,bold] TABS #[fg=#7aa2f7,bg=default,nobold] '
set -g status-right '#[fg=#7dcfff,bg=default]#[fg=#1a1b26,bg=#7dcfff,bold] %H:%M #[fg=#7dcfff,bg=default,nobold]'

# Window pills are provided by Catppuccin.
setw -g window-status-separator ' '
setw -g window-status-activity-style fg=#e0af68,bold
setw -g window-status-bell-style fg=#1a1b26,bg=#f7768e,bold

# =============================================================================
# Reset reference
# =============================================================================
#
# Reused after most transient actions:
#   set -g @mode NORMAL
#   set -g @accent '#7aa2f7'
#   set -gF @hint '#{@hint_global}'
#   if -F '#{@stack_gid}' 'set -g pane-active-border-style fg=#73daca' 'set -g pane-active-border-style fg=#7aa2f7'

# =============================================================================
# Prefix bindings
# =============================================================================

bind -        run-shell '~/.config/tmux/scripts/stacked-pane.py split "#{pane_id}" "#{pane_current_path}" down'
bind _        run-shell '~/.config/tmux/scripts/stacked-pane.py split "#{pane_id}" "#{pane_current_path}" right'
bind c        new-window   -c '#{pane_current_path}'

# =============================================================================
# Root bindings
# =============================================================================

bind -n M-e   if-shell -F '#{pane_at_bottom}' '' 'select-pane -D'
bind -n M-i   if-shell -F '#{pane_at_top}'    '' 'select-pane -U'
bind -n M-n   if-shell -F '#{pane_at_left}'   '' 'select-pane -L'
bind -n M-o   if-shell -F '#{pane_at_right}'  '' 'select-pane -R'

bind -n M-d   detach-client
bind -n M-j   run-shell '~/.config/tmux/scripts/stacked-pane.py prev "#{pane_id}"'
bind -n M-k   run-shell '~/.config/tmux/scripts/stacked-pane.py next "#{pane_id}"'
bind -n M-l   previous-window
bind -n M-ñ   next-window
bind -n M-\?  display-message 'Mode hints are shown in the status bar'

bind -n M-Left    run-shell '~/.config/tmux/scripts/stacked-pane.py move "#{pane_id}" left'
bind -n M-Down    run-shell '~/.config/tmux/scripts/stacked-pane.py move "#{pane_id}" down'
bind -n M-Up      run-shell '~/.config/tmux/scripts/stacked-pane.py move "#{pane_id}" up'
bind -n M-Right   run-shell '~/.config/tmux/scripts/stacked-pane.py move "#{pane_id}" right'

bind -n M-g        run-shell '~/.config/tmux/scripts/stacked-pane.py toggle "#{pane_id}"' \; if -F '#{@stack_gid}' 'set -g pane-active-border-style fg=#73daca' 'set -g pane-active-border-style fg=#7aa2f7' \; set -g @mode NORMAL \; set -g @accent '#7aa2f7' \; set -gF @hint '#{@hint_global}'
bind -n M-u        run-shell '~/.config/tmux/scripts/stacked-pane.py prev "#{pane_id}"' \; set -g @mode NORMAL \; set -g @accent '#7aa2f7' \; set -gF @hint '#{@hint_global}' \; if -F '#{@stack_gid}' 'set -g pane-active-border-style fg=#73daca' 'set -g pane-active-border-style fg=#7aa2f7'
bind -n M-y        run-shell '~/.config/tmux/scripts/stacked-pane.py next "#{pane_id}"' \; set -g @mode NORMAL \; set -g @accent '#7aa2f7' \; set -gF @hint '#{@hint_global}' \; if -F '#{@stack_gid}' 'set -g pane-active-border-style fg=#73daca' 'set -g pane-active-border-style fg=#7aa2f7'

# =============================================================================
# Mode entry bindings
# =============================================================================

bind -n M-p      set -g @mode PANE \; set -g @accent '#9ece6a' \; set -gF @hint '#{@hint_pane}' \; set -g pane-active-border-style 'fg=#9ece6a' \; switch-client -T pane
bind -n M-t      set -g @mode TAB \; set -g @accent '#e0af68' \; set -gF @hint '#{@hint_tab}' \; set -g pane-active-border-style 'fg=#e0af68' \; switch-client -T tab
bind -n M-r      set -g key-table resize \; set -g @mode RESIZE \; set -g @accent '#bb9af7' \; set -gF @hint '#{@hint_resize}' \; set -g pane-active-border-style 'fg=#bb9af7'
bind -n M-s      set -g @mode COPY \; set -g @accent '#ff9e64' \; set -gF @hint '#{@hint_copy}' \; set -g pane-active-border-style 'fg=#ff9e64' \; copy-mode
bind -n M-Space  display-popup -E -w 30% -h 35% -d "#{pane_current_path}" -T ' Sessions ' -s 'bg=#1f2335' -S 'fg=#7aa2f7' '~/.config/tmux/scripts/session-picker.py'

# =============================================================================
# Pane mode (transient)
# =============================================================================

bind -T pane e       run-shell '~/.config/tmux/scripts/stacked-pane.py split "#{pane_id}" "#{pane_current_path}" down' \; set -g @mode NORMAL \; set -g @accent '#7aa2f7' \; set -gF @hint '#{@hint_global}' \; if -F '#{@stack_gid}' 'set -g pane-active-border-style fg=#73daca' 'set -g pane-active-border-style fg=#7aa2f7'
bind -T pane i       run-shell '~/.config/tmux/scripts/stacked-pane.py split "#{pane_id}" "#{pane_current_path}" up' \; set -g @mode NORMAL \; set -g @accent '#7aa2f7' \; set -gF @hint '#{@hint_global}' \; if -F '#{@stack_gid}' 'set -g pane-active-border-style fg=#73daca' 'set -g pane-active-border-style fg=#7aa2f7'
bind -T pane n       run-shell '~/.config/tmux/scripts/stacked-pane.py split "#{pane_id}" "#{pane_current_path}" left' \; set -g @mode NORMAL \; set -g @accent '#7aa2f7' \; set -gF @hint '#{@hint_global}' \; if -F '#{@stack_gid}' 'set -g pane-active-border-style fg=#73daca' 'set -g pane-active-border-style fg=#7aa2f7'
bind -T pane o       run-shell '~/.config/tmux/scripts/stacked-pane.py split "#{pane_id}" "#{pane_current_path}" right' \; set -g @mode NORMAL \; set -g @accent '#7aa2f7' \; set -gF @hint '#{@hint_global}' \; if -F '#{@stack_gid}' 'set -g pane-active-border-style fg=#73daca' 'set -g pane-active-border-style fg=#7aa2f7'

bind -T pane t       set -g @mode STACK \; set -g @accent '#9ece6a' \; set -gF @hint '#{@hint_stack}' \; set -g pane-active-border-style 'fg=#9ece6a' \; switch-client -T stack
bind -T pane m       select-pane -m \; display-message 'pane marked' \; set -g @mode NORMAL \; set -g @accent '#7aa2f7' \; set -gF @hint '#{@hint_global}' \; if -F '#{@stack_gid}' 'set -g pane-active-border-style fg=#73daca' 'set -g pane-active-border-style fg=#7aa2f7'
bind -T pane q       run-shell '~/.config/tmux/scripts/stacked-pane.py kill "#{pane_id}"' \; set -g @mode NORMAL \; set -g @accent '#7aa2f7' \; set -gF @hint '#{@hint_global}'
bind -T pane r       command-prompt -p 'pane title' -I '#{?@stack_label,#{@stack_label},#{pane_title}}' 'run-shell "~/.config/tmux/scripts/stacked-pane.py rename #{pane_id} \"%%\""' \; set -g @mode NORMAL \; set -g @accent '#7aa2f7' \; set -gF @hint '#{@hint_global}' \; if -F '#{@stack_gid}' 'set -g pane-active-border-style fg=#73daca' 'set -g pane-active-border-style fg=#7aa2f7'

bind -T pane Escape  set -g @mode NORMAL \; set -g @accent '#7aa2f7' \; set -gF @hint '#{@hint_global}' \; if -F '#{@stack_gid}' 'set -g pane-active-border-style fg=#73daca' 'set -g pane-active-border-style fg=#7aa2f7'


# =============================================================================
# Tab mode (transient)
# =============================================================================

bind -T tab n        new-window -c '#{pane_current_path}' \; set -g @mode NORMAL \; set -g @accent '#7aa2f7' \; set -gF @hint '#{@hint_global}' \; if -F '#{@stack_gid}' 'set -g pane-active-border-style fg=#73daca' 'set -g pane-active-border-style fg=#7aa2f7'
bind -T tab q        kill-window \; set -g @mode NORMAL \; set -g @accent '#7aa2f7' \; set -gF @hint '#{@hint_global}' \; if -F '#{@stack_gid}' 'set -g pane-active-border-style fg=#73daca' 'set -g pane-active-border-style fg=#7aa2f7'
bind -T tab r        command-prompt -p 'tab title' -I '#W' 'rename-window "%%"' \; set -g @mode NORMAL \; set -g @accent '#7aa2f7' \; set -gF @hint '#{@hint_global}' \; if -F '#{@stack_gid}' 'set -g pane-active-border-style fg=#73daca' 'set -g pane-active-border-style fg=#7aa2f7'
bind -T tab s        setw synchronize-panes \; display-message 'sync: #{?pane_synchronized,on,off}' \; set -g @mode NORMAL \; set -g @accent '#7aa2f7' \; set -gF @hint '#{@hint_global}' \; if -F '#{@stack_gid}' 'set -g pane-active-border-style fg=#73daca' 'set -g pane-active-border-style fg=#7aa2f7'

bind -T tab Escape   set -g @mode NORMAL \; set -g @accent '#7aa2f7' \; set -gF @hint '#{@hint_global}' \; if -F '#{@stack_gid}' 'set -g pane-active-border-style fg=#73daca' 'set -g pane-active-border-style fg=#7aa2f7'

# =============================================================================
# Resize mode (persistent)
# =============================================================================

bind -T resize e       resize-pane -D 5
bind -T resize i       resize-pane -U 5
bind -T resize n       resize-pane -L 5
bind -T resize o       resize-pane -R 5

bind -T resize Escape  set -g key-table root \; set -g @mode NORMAL \; set -g @accent '#7aa2f7' \; set -gF @hint '#{@hint_global}' \; if -F '#{@stack_gid}' 'set -g pane-active-border-style fg=#73daca' 'set -g pane-active-border-style fg=#7aa2f7'

# =============================================================================
# Session mode (transient)
# =============================================================================

bind -T session s       display-popup -E -w 30% -h 35% -d "#{pane_current_path}" -T ' Sessions ' -s 'bg=#1f2335' -S 'fg=#7aa2f7' '~/.config/tmux/scripts/session-picker.py' \; set -g @mode NORMAL \; set -g @accent '#7aa2f7' \; set -gF @hint '#{@hint_global}' \; if -F '#{@stack_gid}' 'set -g pane-active-border-style fg=#73daca' 'set -g pane-active-border-style fg=#7aa2f7'
bind -T session l       last-session \; set -g @mode NORMAL \; set -g @accent '#7aa2f7' \; set -gF @hint '#{@hint_global}' \; if -F '#{@stack_gid}' 'set -g pane-active-border-style fg=#73daca' 'set -g pane-active-border-style fg=#7aa2f7'
bind -T session r       command-prompt -p 'session name' -I '#S' 'rename-session "%%"' \; set -g @mode NORMAL \; set -g @accent '#7aa2f7' \; set -gF @hint '#{@hint_global}' \; if -F '#{@stack_gid}' 'set -g pane-active-border-style fg=#73daca' 'set -g pane-active-border-style fg=#7aa2f7'
bind -T session c       display-popup -E '${EDITOR:-vi} ~/.config/tmux/tmux.conf' \; set -g @mode NORMAL \; set -g @accent '#7aa2f7' \; set -gF @hint '#{@hint_global}' \; if -F '#{@stack_gid}' 'set -g pane-active-border-style fg=#73daca' 'set -g pane-active-border-style fg=#7aa2f7'
bind -T session p       display-message 'Mode hints live in the status bar now' \; set -g @mode NORMAL \; set -g @accent '#7aa2f7' \; set -gF @hint '#{@hint_global}' \; if -F '#{@stack_gid}' 'set -g pane-active-border-style fg=#73daca' 'set -g pane-active-border-style fg=#7aa2f7'
bind -T session w       choose-tree -sZ \; set -g @mode NORMAL \; set -g @accent '#7aa2f7' \; set -gF @hint '#{@hint_global}' \; if -F '#{@stack_gid}' 'set -g pane-active-border-style fg=#73daca' 'set -g pane-active-border-style fg=#7aa2f7'

bind -T session Escape  set -g @mode NORMAL \; set -g @accent '#7aa2f7' \; set -gF @hint '#{@hint_global}' \; if -F '#{@stack_gid}' 'set -g pane-active-border-style fg=#73daca' 'set -g pane-active-border-style fg=#7aa2f7'

# =============================================================================
# Copy mode (copy-mode-vi)
# =============================================================================

bind -T copy-mode-vi v       send -X begin-selection
bind -T copy-mode-vi /       command-prompt -p 'search down' 'send -X search-forward "%%"'
bind -T copy-mode-vi ?       command-prompt -p 'search up' 'send -X search-backward "%%"'
bind -T copy-mode-vi n       send -X search-again
bind -T copy-mode-vi N       send -X search-reverse

bind -T copy-mode-vi y       send -X copy-selection-and-cancel \; set -g @mode NORMAL \; set -g @accent '#7aa2f7' \; set -gF @hint '#{@hint_global}' \; if -F '#{@stack_gid}' 'set -g pane-active-border-style fg=#73daca' 'set -g pane-active-border-style fg=#7aa2f7'
bind -T copy-mode-vi q       send -X cancel \; set -g @mode NORMAL \; set -g @accent '#7aa2f7' \; set -gF @hint '#{@hint_global}' \; if -F '#{@stack_gid}' 'set -g pane-active-border-style fg=#73daca' 'set -g pane-active-border-style fg=#7aa2f7'
bind -T copy-mode-vi Escape  send -X cancel \; set -g @mode NORMAL \; set -g @accent '#7aa2f7' \; set -gF @hint '#{@hint_global}' \; if -F '#{@stack_gid}' 'set -g pane-active-border-style fg=#73daca' 'set -g pane-active-border-style fg=#7aa2f7'

# =============================================================================
# Quality of life
# =============================================================================

bind -n M-R source-file ~/.config/tmux/tmux.conf \; display-message 'tmux config reloaded'
