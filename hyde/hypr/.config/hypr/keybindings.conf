general {
    no_focus_fallback = true
    layout = master
}

master {
    mfact = 0.70
    new_status = slave
}

binds {
    hide_special_on_workspace_change = true
}

########## Variables ##########
$mainMod = Super # super / meta / windows key
$term    = kitty

########## Window/Session actions ##########
bindd = $mainMod+Shift, P,      Color Picker,   exec, hyprpicker -a 
bind  = ,                F12,    killactive
bind  = Alt,             F4,     exec,           $scrPath/dontkillsteam.sh
bind  = $mainMod,        Delete, exit,
bind  = $mainMod Shift,  F,      togglefloating,
bind  = $mainMod Shift,  N,      pin,
bind  = $mainMod Shift,  G,      togglegroup,
bind  = $mainMod Shift,  equal,  exec,           $scrPath/logoutlaunch.sh
bind  = $mainMod,        plus,   exec,           $scrPath/logoutlaunch.sh
bind  = $mainMod Shift,  9,      exec,           dunstctl close-all

########## Application shortcuts ##########
bind = $mainMod, SPACE, exec, $term
bindd = $mainMod, F11,   toggle kanata layout, exec, ~/.local/bin/kanata_up.sh

########## Rofi menus ##########
bind  = $mainMod,       RETURN, exec, pkill -x rofi || $scrPath/rofilaunch.sh d
bind  = $mainMod Shift, RETURN, exec, pkill -x rofi || $scrPath/rofi_websearch.sh
bindd = $mainMod Shift, E,      $d emoji  picker , exec, pkill -x rofi || $scrPath/custom_emoji_picker.sh # launch emoji picker
bindd = $mainMod Shift, A,      $d select rofi launcher , exec, pkill -x rofi || $scrPath/rofiselect.sh # launch select menu
bindd = $mainMod Shift, W,      $d select a global wallpaper , exec, pkill -x rofi || $scrPath/wallpaper.sh -SG # launch wallpaper select menu
bindd = $mainMod Shift, L,      $d select hyprlock layout, exec, pkill -x rofi || $scrPath/hyprlock.sh --select # launch hyprlock layout select menu
bindd = $mainMod Shift, T,      $d select a theme, exec, pkill -x rofi || $scrPath/themeselect.sh # launch theme select menu
bindd = $mainMod Shift, U,      $d update system, exec, hyprctl dispatch exec 'system.update.sh' up# launch update script

########## Audio control ##########
bindl  = ,         XF86AudioMute,        exec, $scrPath/volumecontrol.sh -o m
bindl  = $mainMod, J,                    exec, $scrPath/volumecontrol.sh -i m
bindel = ,         XF86AudioLowerVolume, exec, $scrPath/volumecontrol.sh -o d
bindel = ,         XF86AudioRaiseVolume, exec, $scrPath/volumecontrol.sh -o i

########## Media control ##########
bindl  = , XF86AudioPlay,  exec, playerctl play-pause
bindl  = , XF86AudioPause, exec, playerctl play-pause
bindl  = , XF86AudioNext,  exec, playerctl next
bindl  = , XF86AudioPrev,  exec, playerctl previous

########## Brightness control ##########
bindel = , XF86MonBrightnessUp,   exec, $scrPath/brightnesscontrol.sh i
bindel = , XF86MonBrightnessDown, exec, $scrPath/brightnesscontrol.sh d

########## Screenshots ##########
bind = $mainMod, P, exec, $scrPath/screenshot.sh s
bind = , Print, exec, $scrPath/screenshot.sh p

########## Clipboard ##########
bindd = $mainMod,       C, $d clipboard ,  exec, pkill -x rofi || $scrPath/custom_cliphist.sh -c # launch �kulipboard,
bindd = $mainMod Shift, C, $d �kulipboard manager , exec, pkill -x rofi || $scrPath/cliphist.sh # launch clipboard Manager

########## Move/Change window focus ##########
bind = $mainMod, N, movefocus, l
bind = $mainMod, O, movefocus, r
bind = $mainMod, I, movefocus, u
bind = $mainMod, E, movefocus, d

########## Move/Change window focus in group ##########
bind = $mainMod, U, changegroupactive, b 
bind = $mainMod, Y, changegroupactive, f

########## Switch workspaces ##########
bind = $mainMod,         h,          workspace, 1
bind = $mainMod + Shift, slash,      workspace, 2
bind = $mainMod,         question,   workspace, 2
bind = $mainMod,         dead_acute, workspace, 3
bind = $mainMod,         dead_grave,      workspace, 4
bind = $mainMod,         V,  workspace, 5

########## Switch to a relative workspace ##########
bind = $mainMod, ntilde, workspace, r+1
bind = $mainMod,      L, workspace, r-1

########## Move focused window to a relative workspace ##########
bind = $mainMod, END,  movetoworkspace, r+1
bind = $mainMod, HOME, movetoworkspace, r-1

########## Resize windows ##########
binde = $mainMod ALT_L, N, resizeactive, -20 0
binde = $mainMod ALT_L, O, resizeactive, 20 0
binde = $mainMod ALT_L, I, resizeactive, 0 -20
binde = $mainMod ALT_L, E, resizeactive, 0 20

########## Move active window ##########
$moveactivewindow = grep -q "true" <<< $(hyprctl activewindow -j | jq -r .floating) && hyprctl dispatch moveactive
binded = $mainMod, left,  Move activewindow to the right, exec, $moveactivewindow -30 0 || hyprctl dispatch movewindoworgroup l 
binded = $mainMod, right, Move activewindow to the right, exec, $moveactivewindow 30 0  || hyprctl dispatch movewindoworgroup r 
binded = $mainMod, up,    Move activewindow to the right, exec, $moveactivewindow 0 -30 || hyprctl dispatch movewindoworgroup u 
binded = $mainMod, down,  Move activewindow to the right, exec, $moveactivewindow 0 30  || hyprctl dispatch movewindoworgroup d 

########## Move/Resize focused window with mouse ##########
bindm = Alt, mouse:272, movewindow
bindm = Alt, mouse:273, resizewindow

########## Special workspaces ##########
bind = $mainMod, S,     exec, sh -c 'hyprctl dispatch togglespecialworkspace spotify; sleep 0.1; if hyprctl -j activewindow | jq -e ".class==\"vivaldi-spotify.com__-Default\"" >/dev/null; then hyprctl dispatch sendshortcut "CTRL,code:45,active"; fi'
bind = $mainMod, D,     togglespecialworkspace, discord
bind = $mainMod, W,     togglespecialworkspace, whatsapp
bind = $mainMod, T,     togglespecialworkspace, ticktick
bind = $mainMod, F,     togglespecialworkspace, pdf
bind = $mainMod, TAB,   togglespecialworkspace, chatgpt
bind = $mainMod, R,     togglespecialworkspace, obs
bind = $mainMod, G,     togglespecialworkspace, github
bind = $mainMod, K,     togglespecialworkspace, obsidian
bind = $mainMod, MINUS, togglespecialworkspace, meet
bind = $mainMod, M,     togglespecialworkspace, mail

######### Custom shortcuts ##########

bind = CTRL, code:28, exec, sh -c 'w=$(hyprctl -j activewindow); cls=$(echo "$w" | jq -r .class); if echo "$cls" | grep -Eq "^vivaldi-(chatgpt|discord|spotify|ticktick)\\.com__"; then hyprctl dispatch sendshortcut "CTRL,code:45,active"; elif [ "$cls" = "vivaldi-web.whatsapp.com__-Default" ]; then hyprctl dispatch sendshortcut "ALT,code:45,active"; else hyprctl dispatch sendshortcut "CTRL,code:28,active"; fi'

bind = $mainMod Shift, H, exec, handy --toggle-transcription
bind = $mainMod Shift, K, exec, handy --toggle-post-process
