windowrule = opacity 1 override 1 override 1 override,       match:class ^(firefox)$
windowrule = opacity 1 override 1 override 1 override,       match:class ^(Brave-browser)$
windowrule = opacity 1 override 1 override 1 override,       match:class ^(code-oss)$
windowrule = opacity 1 override 1 override 1 override,       match:class ^([Cc]ode)$
windowrule = opacity 1 override 1 override 1 override,       match:class ^(code-url-handler)$
windowrule = opacity 1 override 1 override 1 override,       match:class ^(code-insiders-url-handler)$
windowrule = opacity 0.92 override 0.92 override 1 override, match:class ^(kitty)$
windowrule = opacity 0.95 override 0.95 override 1 override, match:class ^(term)$
windowrule = opacity 0.95 override 0.95 override 1 override, match:class ^(nvim)$
windowrule = opacity 0.95 override 0.95 override 1 override, match:class ^(yazi)$
windowrule = opacity 1 override 1 override 1 override,       match:class ^(code)$
windowrule = opacity 0.95 override 0.95 override 1 override, match:class ^(dev.zed.Zed)$
windowrule = opacity 0.95 override 0.95 override 1 override, match:class ^(neovide)$
windowrule = opacity 0.8 override 0.8 override 1 override,   match:class ^(org.kde.dolphin)$
# windowrule = opacity 0.9 override 0.9 override 1 override,   match:class ^(obsidian)$
windowrule = opacity 1 override 1 override 1 override,       match:class ^(org.kde.ark)$
windowrule = opacity 1 override 1 override 1 override,       match:class ^(nwg-look)$
windowrule = opacity 1 override 1 override 1 override,       match:class ^(qt5ct)$
windowrule = opacity 1 override 1 override 1 override,       match:class ^(qt6ct)$
windowrule = opacity 1 override 1 override 1 override,       match:class ^(kvantummanager)$
windowrule = opacity 0.8 override 0.8 override 1 override,   match:class ^(org.pulseaudio.pavucontrol)$
windowrule = opacity 0.8 override 0.8 override 1 override,   match:class ^(blueman-manager)$
windowrule = opacity 0.8 override 0.8 override 1 override,   match:class ^(nm-applet)$
windowrule = opacity 0.8 override 0.8 override 1 override,   match:class ^(nm-connection-editor)$
windowrule = opacity 1 override 1 override 1 override,       match:class ^(org.kde.polkit-kde-authentication-agent-1)$
windowrule = opacity 1 override 1 override 1 override,       match:class ^(polkit-gnome-authentication-agent-1)$
windowrule = opacity 1 override 1 override 1 override,       match:class ^(org.freedesktop.impl.portal.desktop.gtk)$
windowrule = opacity 1 override 1 override 1 override,       match:class ^(org.freedesktop.impl.portal.desktop.hyprland)$
windowrule = opacity 1 override 1 override 1 override,       match:class ^([Ss]team)$
windowrule = opacity 1 override 1 override 1 override,       match:class ^(steamwebhelper)$
windowrule = opacity 1 override 1 override 1 override,       match:class ^([Ss]potify)$
windowrule = opacity 1 override 1 override 1 override,       match:initial_title ^(Spotify Free)$
windowrule = opacity 1 override 1 override 1 override,       match:initial_title ^(Spotify Premium)$

# Automatically open apps in their own workspace

# Neovim terminals
windowrule = workspace 2,                  match:class ^(nvim)$
windowrule = group set lock invade always, match:class ^(nvim)$
windowrule = workspace 2,                  match:class ^(neovide)$
windowrule = group set lock invade always, match:class ^(neovide)$

# Plain Kitty shells 
windowrule = workspace 3, match:class ^(term)$, match:initial_title ^(kitty)$

# Yazi file-manager 
windowrule = workspace 4, match:class ^(yazi)$

# Youtube
windowrule = workspace 5,                  match:class ^(vivaldi-youtube\.com.*)$
windowrule = group set lock invade always, match:class ^(vivaldi-youtube\.com.*)$  # group YouTube windows

# Special app workspaces
windowrule = workspace special:spotify,    match:class ^(vivaldi-spotify\.com.*)$
windowrule = workspace special:whatsapp,   match:class ^(vivaldi-web.whatsapp\.com.*)$
windowrule = no_screen_share on,            match:class ^(vivaldi-web.whatsapp\.com.*)$
windowrule = workspace special:discord,    match:class ^(vivaldi-discord\.com.*)$
windowrule = workspace special:ticktick,   match:class ^(vivaldi-ticktick\.com.*)$
windowrule = no_screen_share on,            match:class ^(vivaldi-ticktick\.com.*)$
windowrule = workspace special:obsidian,   match:class ^(obsidian)$
windowrule = workspace special:chatgpt,    match:class ^(vivaldi-chatgpt\.com.*)$
windowrule = group set lock invade always, match:class ^(vivaldi-chatgpt\.com.*)$  # group ChatGPT windows
windowrule = workspace special:pdf,        match:class ^(org.pwmt.zathura)$
windowrule = group set lock invade always, match:class ^(org.pwmt.zathura)$  # group PDF windows
windowrule = workspace special:obs,        match:class ^(com.obsproject.Studio)$
windowrule = workspace special:github,     match:class ^(vivaldi-github\.com.*)$
windowrule = group set lock invade always, match:class ^(vivaldi-github\.com.*)$  # group GitHub windows
windowrule = workspace special:meet,       match:class ^(vivaldi-meet\.google\.com.*)$
windowrule = workspace special:mail,       match:class ^(vivaldi-mail\.google\.com.*|vivaldi-outlook\.live\.com.*)$
windowrule = group set lock invade always, match:class ^(vivaldi-mail\.google\.com.*|vivaldi-outlook\.live\.com.*)$  # group mail windows
windowrule = no_screen_share on,           match:class ^(vivaldi-mail\.google\.com.*|vivaldi-outlook\.live\.com.*)$  # group mail windows


