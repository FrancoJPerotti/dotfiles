group {
    groupbar {
        enabled = true
        col.active = rgba(ca9ee6ff) 
        col.inactive = rgba(666666ff)
        col.locked_active = rgba(ca9ee6ff) 
        col.locked_inactive = rgba(666666ff)
        font_size = 17
        text_color = rgba(000000ff)
        gradients = true
        gradient_rounding = 10
        render_titles = true
        indicator_height = 0
        height = 20
    }

    col.border_locked_active = rgba(8040bfff)
    col.border_locked_inactive = rgba(090000ff)

    auto_group = true
}


# layerrule = unset, match:namespace rofi
# layerrule = unset, match:namespace notifications
# layerrule = unset, match:namespace swaync-notification-window
# layerrule = unset, match:namespace swaync-control-center
# layerrule = unset, match:namespace logout_dialog


layerrule = blur on, match:namespace rofi
layerrule = ignore_alpha 0, match:namespace rofi
layerrule = blur on, match:namespace notifications
layerrule = ignore_alpha 0, match:namespace notifications
layerrule = blur on, match:namespace swaync-notification-window
layerrule = ignore_alpha 0, match:namespace swaync-notification-window
layerrule = blur on, match:namespace swaync-control-center
layerrule = ignore_alpha 0, match:namespace swaync-control-center
layerrule = blur on, match:namespace logout_dialog

layerrule {
    name = waybar-no-blur
    match:namespace = waybar
    blur = false
}

