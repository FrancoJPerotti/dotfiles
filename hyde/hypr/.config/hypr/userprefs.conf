# Personal Stuff
exec-once = wlsunset -t 4500 -l -31.4 -L -64.1 # dim screen at sunset
exec-once = kdeconnect-cli -n Galaxy\ S20 # connect to phone through kdeconnect


#     _                   __ 
#    (_)___  ____  __  __/ /_
#   / / __ \/ __ \/ / / / __/
#  / / / / / /_/ / /_/ / /_  
# /_/_/ /_/ .___/\__,_/\__/  
