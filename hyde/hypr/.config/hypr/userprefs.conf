input {
    kb_layout = us,cdhwic
    kb_variant = intl,cdhwic
    resolve_binds_by_sym = 1
    follow_mouse = 1

    touchpad {
        natural_scroll = yes
    }

    sensitivity = 0
    force_no_accel = 1
}

device {
    name = epic mouse V1
    sensitivity = 0.5
}

gesture = 3, horizontal, unset
gesture = 3, horizontal, workspace

#                _                 __  _           
#   ____ _____  (_)___ ___  ____ _/ /_(_)___  ____ 
#  / __ `/ __ \/ / __ `__ \/ __ `/ __/ / __ \/ __ \
# / /_/ / / / / / / / / / / /_/ / /_/ / /_/ / / / /
# \__,_/_/ /_/_/_/ /_/ /_/\__,_/\__/_/\____/_/ /_/ 


animations {
    enabled = no
}


#        __                           __  _           
#   ____/ /__  _________  _________ _/ /_(_)___  ____ 
#  / __  / _ \/ ___/ __ \/ ___/ __ `/ __/ / __ \/ __ \
# / /_/ /  __/ /__/ /_/ / /  / /_/ / /_/ / /_/ / / / /
# \__,_/\___/\___/\____/_/   \__,_/\__/_/\____/_/ /_/ 
                                                    

decoration {
	dim_inactive = true
	dim_strength = 0.23
    active_opacity = 1
    inactive_opacity = 1
    fullscreen_opacity = 1

    shadow {
        enabled = false
    }
}


