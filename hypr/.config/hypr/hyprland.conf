$scrPath = $HOME/.local/share/bin # set scripts path


#                           _ __                 
#    ____ ___  ____  ____  (_) /_____  __________
#   / __ `__ \/ __ \/ __ \/ / __/ __ \/ ___/ ___/
#  / / / / / / /_/ / / / / / /_/ /_/ / /  (__  ) 
# /_/ /_/ /_/\____/_/ /_/_/\__/\____/_/  /____/  
                                               
                                            
monitor = ,preferred,auto,auto

$main_monitor = DP-3
# $laptop_main_monitor = eDP-1


#     __                       __  
#    / /___ ___  ______  _____/ /_ 
#   / / __ `/ / / / __ \/ ___/ __ \
#  / / /_/ / /_/ / / / / /__/ / / /
# /_/\__,_/\__,_/_/ /_/\___/_/ /_/ 
                                 

# Basic Stuff
exec-once = $scrPath/resetxdgportal.sh # reset XDPH for screenshare
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP # for XDPH
exec-once = dbus-update-activation-environment --systemd --all # for XDPH
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP # for XDPH
exec-once = $scrPath/polkitkdeauth.sh # authentication dialogue for GUI apps
exec-once = waybar # launch the system bar
exec-once = blueman-applet # systray app for Bluetooth
exec-once = udiskie --no-automount --smart-tray # front-end that allows to manage removable media
exec-once = nm-applet --indicator # systray app for Network/Wifi
exec-once = dunst # start notification demon
exec-once = wl-paste --type text --watch cliphist store # clipboard store text data
exec-once = wl-paste --type image --watch cliphist store # clipboard store image data
exec-once = $scrPath/swwwallpaper.sh # start wallpaper daemon
# exec-once = $scrPath/batterynotify.sh # battery notification

# Personal Stuff
exec-once = wlsunset -t 4500 -l -31.4 -L -64.1 # dim screen at sunset
exec-once = kdeconnect-cli -n Galaxy\ S20 # connect to phone through kdeconnect
exec-once = $srcPath/capslock_notifier.sh


#   ___  ____ _   __
#  / _ \/ __ \ | / /
# /  __/ / / / |/ / 
# \___/_/ /_/|___/  
                  

env = PATH,$PATH:$scrPath
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_QPA_PLATFORMTHEME,qt6ct
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = QT_AUTO_SCREEN_SCALE_FACTOR,1
env = MOZ_ENABLE_WAYLAND,1
env = GDK_SCALE,1


#     _                   __ 
#    (_)___  ____  __  __/ /_
#   / / __ \/ __ \/ / / / __/
#  / / / / / /_/ / /_/ / /_  
# /_/_/ /_/ .___/\__,_/\__/  
#        /_/                 


input {
    kb_layout = us
    kb_variant = intl
    follow_mouse = 1

    touchpad {
        natural_scroll = no
    }

    sensitivity = 0
    force_no_accel = 1
    accel_profile = flat
    numlock_by_default = true
}

device {
    name = epic mouse V1
    sensitivity = 0.5
}

gestures {
    workspace_swipe = true
    workspace_swipe_fingers = 3
}


#     __                        __      
#    / /___ ___  ______  __  __/ /______
#   / / __ `/ / / / __ \/ / / / __/ ___/
#  / / /_/ / /_/ / /_/ / /_/ / /_(__  ) 
# /_/\__,_/\__, /\____/\__,_/\__/____/  
#         /____/                        


dwindle {
    pseudotile = yes
    preserve_split = yes
}

master {
    new_status = master
}


#               _          
#    ____ ___  (_)_________
#   / __ `__ \/ / ___/ ___/
#  / / / / / / (__  ) /__  
# /_/ /_/ /_/_/____/\___/  
                         

misc {
    vrr = 0
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
}

xwayland {
    force_zero_scaling = true
}


#                _                 __  _           
#   ____ _____  (_)___ ___  ____ _/ /_(_)___  ____ 
#  / __ `/ __ \/ / __ `__ \/ __ `/ __/ / __ \/ __ \
# / /_/ / / / / / / / / / / /_/ / /_/ / /_/ / / / /
# \__,_/_/ /_/_/_/ /_/ /_/\__,_/\__/_/\____/_/ /_/ 


animations {
    enabled = no
}


#        __                           __  _           
#   ____/ /__  _________  _________ _/ /_(_)___  ____ 
#  / __  / _ \/ ___/ __ \/ ___/ __ `/ __/ / __ \/ __ \
# / /_/ /  __/ /__/ /_/ / /  / /_/ / /_/ / /_/ / / / /
# \__,_/\___/\___/\____/_/   \__,_/\__/_/\____/_/ /_/ 
                                                    

decoration {
	dim_inactive = true
	dim_strength = 0.23
}


#                       __                                  
#  _      ______  _____/ /___________  ____ _________  _____
# | | /| / / __ \/ ___/ //_/ ___/ __ \/ __ `/ ___/ _ \/ ___/
# | |/ |/ / /_/ / /  / ,< (__  ) /_/ / /_/ / /__/  __(__  ) 
# |__/|__/\____/_/  /_/|_/____/ .___/\__,_/\___/\___/____/  
#                            /_/                            


workspace=1, monitor:$main_monitor, persistent:true
workspace=2, monitor:$main_monitor, persistent:true
workspace=3, monitor:$main_monitor, persistent:true
workspace=4, monitor:$main_monitor, persistent:true


#    _________  __  _______________  _____
#   / ___/ __ \/ / / / ___/ ___/ _ \/ ___/
#  (__  ) /_/ / /_/ / /  / /__/  __(__  ) 
# /____/\____/\__,_/_/   \___/\___/____/  
                                        

source = ~/.config/hypr/keybindings.conf
source = ~/.config/hypr/windowrules.conf
source = ~/.config/hypr/themes/theme.conf # theme specific settings
source = ~/.config/hypr/monitors.conf # initially empty, to be configured by user and remains static


