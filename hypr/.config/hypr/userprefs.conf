exec = hyprctl setcursor Bibata-Modern-Ice 20
exec = gsettings set org.gnome.desktop.interface cursor-theme 'Bibata-Modern-Ice'
exec = gsettings set org.gnome.desktop.interface cursor-size 20


#    __  __                      
#   / /_/ /_  ___  ____ ___  ___ 
#  / __/ __ \/ _ \/ __ `__ \/ _ \
# / /_/ / / /  __/ / / / / /  __/
# \__/_/ /_/\___/_/ /_/ /_/\___/ 
                               

group {
    groupbar {
        enabled = true
        col.active = rgba(ca9ee6ff) 
        col.inactive = rgba(666666ff)
        col.locked_active = rgba(ca9ee6ff) rgba(f2d5cfff) 45deg
        col.locked_inactive = rgba(b4befecc) rgba(6c7086cc) 45deg
        font_size = 17
        text_color = rgba(000000ff)
        gradients = true
        gradient_rounding = 10
        render_titles = true
        indicator_height = 0
        height = 20
    }
}


layerrule = unset,rofi
layerrule = unset,notifications
layerrule = unset,swaync-notification-window
layerrule = unset,swaync-control-center
layerrule = unset,logout_dialog


layerrule = blur,rofi
layerrule = ignorezero,rofi
layerrule = blur,notifications
layerrule = ignorezero,notifications
layerrule = blur,swaync-notification-window
layerrule = ignorezero,swaync-notification-window
layerrule = blur,swaync-control-center
layerrule = ignorezero,swaync-control-center
layerrule = unset, waybar
layerrule = blur,logout_dialog

