windowrule = opacity 1 $& 1 $& 1,       class:^(firefox)$
windowrule = opacity 1 $& 1 $& 1,       class:^(Brave-browser)$
windowrule = opacity 1 $& 1 $& 1,       class:^(code-oss)$
windowrule = opacity 1 $& 1 $& 1,       class:^([Cc]ode)$
windowrule = opacity 1 $& 1 $& 1,       class:^(code-url-handler)$
windowrule = opacity 1 $& 1 $& 1,       class:^(code-insiders-url-handler)$
windowrule = opacity 0.95 $& 0.95 $& 1, class:^(kitty)$
windowrule = opacity 0.95 $& 0.95 $& 1, class:^(term)$
windowrule = opacity 0.95 $& 0.95 $& 1, class:^(nvim)$
windowrule = opacity 0.95 $& 0.95 $& 1, class:^(yazi)$
windowrule = opacity 0.95 $& 0.95 $& 1, class:^(code)$
windowrule = opacity 0.95 $& 0.95 $& 1, class:^(dev.zed.Zed)$
windowrule = opacity 0.95 $& 0.95 $& 1, class:^(neovide)$
windowrule = opacity 0.8 $& 0.8 $& 1,   class:^(org.kde.dolphin)$
windowrule = opacity 0.9 $& 0.9 $& 1,   class:^(obsidian)$
windowrule = opacity 1 $& 1 $& 1,       class:^(org.kde.ark)$
windowrule = opacity 1 $& 1 $& 1,       class:^(nwg-look)$
windowrule = opacity 1 $& 1 $& 1,       class:^(qt5ct)$
windowrule = opacity 1 $& 1 $& 1,       class:^(qt6ct)$
windowrule = opacity 1 $& 1 $& 1,       class:^(kvantummanager)$
windowrule = opacity 0.8 $& 0.8 $& 1,   class:^(org.pulseaudio.pavucontrol)$
windowrule = opacity 0.8 $& 0.8 $& 1,   class:^(blueman-manager)$
windowrule = opacity 0.8 $& 0.8 $& 1,   class:^(nm-applet)$
windowrule = opacity 0.8 $& 0.8 $& 1,   class:^(nm-connection-editor)$
windowrule = opacity 1 $& 1 $& 1,       class:^(org.kde.polkit-kde-authentication-agent-1)$
windowrule = opacity 1 $& 1 $& 1,       class:^(polkit-gnome-authentication-agent-1)$
windowrule = opacity 1 $& 1 $& 1,       class:^(org.freedesktop.impl.portal.desktop.gtk)$
windowrule = opacity 1 $& 1 $& 1,       class:^(org.freedesktop.impl.portal.desktop.hyprland)$
windowrule = opacity 1 $& 1 $& 1,       class:^([Ss]team)$
windowrule = opacity 1 $& 1 $& 1,       class:^(steamwebhelper)$
windowrule = opacity 1 $& 1 $& 1,       class:^([Ss]potify)$
windowrule = opacity 1 $& 1 $& 1,       initialTitle:^(Spotify Free)$
windowrule = opacity 1 $& 1 $& 1,       initialTitle:^(Spotify Premium)$

# Automatically open apps in their own workspace

# Neovim terminals
windowrulev2 = workspace 2,                  class:^(nvim)$
windowrulev2 = group set lock invade always, class:^(nvim)$
windowrulev2 = workspace 2,                  class:^(neovide)$
windowrulev2 = group set lock invade always, class:^(neovide)$

# Plain Kitty shells 
windowrulev2 = workspace 3, class:^(term)$, initialTitle:^(kitty)$

# Yazi file-manager 
windowrulev2 = workspace 4, class:^(yazi)$

# Youtube
windowrulev2 = workspace 5,                  class:^(vivaldi-youtube\.com.*)$
windowrulev2 = group set lock invade always, class:^(vivaldi-youtube\.com.*)$  # group YouTube windows

# Special app workspaces
windowrulev2 = workspace special:spotify,    class:^(vivaldi-spotify\.com.*)$
windowrulev2 = workspace special:whatsapp,   class:^(vivaldi-web.whatsapp\.com.*)$
windowrule   = noscreenshare,                class:^(vivaldi-web.whatsapp\.com.*)$
windowrulev2 = workspace special:discord,    class:^(vivaldi-discord\.com.*)$
windowrulev2 = workspace special:ticktick,   class:^(vivaldi-ticktick\.com.*)$
windowrule   = noscreenshare,                class:^(vivaldi-ticktick\.com.*)$
windowrulev2 = workspace special:obsidian,   class:^(obsidian)$
windowrulev2 = workspace special:chatgpt,    class:^(vivaldi-chatgpt\.com.*)$
windowrulev2 = group set lock invade always, class:^(vivaldi-chatgpt\.com.*)$  # group ChatGPT windows
windowrulev2 = workspace special:pdf,        class:^(org.pwmt.zathura)$
windowrulev2 = group set lock invade always, class:^(org.pwmt.zathura)$  # group PDF windows
windowrulev2 = workspace special:obs,        class:^(com.obsproject.Studio)$
windowrulev2 = workspace special:github,     class:^(vivaldi-github\.com.*)$
windowrulev2 = group set lock invade always, class:^(vivaldi-github\.com.*)$  # group GitHub windows
windowrulev2 = workspace special:meet,       class:^(vivaldi-meet\.google\.com.*)$
windowrulev2 = workspace special:mail,       class:^(vivaldi-mail\.google\.com.*|vivaldi-outlook\.live\.com.*)$
windowrulev2 = group set lock invade always, class:^(vivaldi-mail\.google\.com.*|vivaldi-outlook\.live\.com.*)$  # group mail windows
windowrule = noscreenshare,                  class:^(vivaldi-mail\.google\.com.*|vivaldi-outlook\.live\.com.*)$  # group mail windows


