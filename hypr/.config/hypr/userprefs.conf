# Personal Stuff
exec-once = wlsunset -t 4500 -l -31.4 -L -64.1 # dim screen at sunset
exec-once = kdeconnect-cli -n Galaxy\ S20 # connect to phone through kdeconnect


#     _                   __ 
#    (_)___  ____  __  __/ /_
#   / / __ \/ __ \/ / / / __/
#  / / / / / /_/ / /_/ / /_  
# /_/_/ /_/ .___/\__,_/\__/  
#        /_/                 


input {
    kb_layout = us
    kb_variant = intl
    follow_mouse = 1

    touchpad {
        natural_scroll = yes
    }

    sensitivity = 0
    force_no_accel = 1
}

device {
    name = epic mouse V1
    sensitivity = 0.5
}

gestures {
    workspace_swipe = true
    workspace_swipe_fingers = 3
}


#                _                 __  _           
#   ____ _____  (_)___ ___  ____ _/ /_(_)___  ____ 
#  / __ `/ __ \/ / __ `__ \/ __ `/ __/ / __ \/ __ \
# / /_/ / / / / / / / / / / /_/ / /_/ / /_/ / / / /
# \__,_/_/ /_/_/_/ /_/ /_/\__,_/\__/_/\____/_/ /_/ 


animations {
    enabled = no
}


#        __                           __  _           
#   ____/ /__  _________  _________ _/ /_(_)___  ____ 
#  / __  / _ \/ ___/ __ \/ ___/ __ `/ __/ / __ \/ __ \
# / /_/ /  __/ /__/ /_/ / /  / /_/ / /_/ / /_/ / / / /
# \__,_/\___/\___/\____/_/   \__,_/\__/_/\____/_/ /_/ 
                                                    

decoration {
	dim_inactive = true
	dim_strength = 0.23
    active_opacity = 1
    inactive_opacity = 1
    fullscreen_opacity = 1

    shadow {
        enabled = false
    }
}


#                       __                                  
#  _      ______  _____/ /___________  ____ _________  _____
# | | /| / / __ \/ ___/ //_/ ___/ __ \/ __ `/ ___/ _ \/ ___/
# | |/ |/ / /_/ / /  / ,< (__  ) /_/ / /_/ / /__/  __(__  ) 
# |__/|__/\____/_/  /_/|_/____/ .___/\__,_/\___/\___/____/  
#                            /_/                            

$main_monitor = eDP-1
# $main_monitor = DP-3
workspace=1, monitor:$main_monitor, persistent:true
workspace=2, monitor:$main_monitor, persistent:true
workspace=3, monitor:$main_monitor, persistent:true
workspace=4, monitor:$main_monitor, persistent:true


